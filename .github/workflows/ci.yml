name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# These jobs only read the repository. The release workflow asks for more,
# per job, where it needs it.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make format
      - run: git diff --exit-code

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      # goreleaser resolves the release target from the remote, so it needs
      # the repository's history rather than a shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  integration:
    # Drives the compiled binary: real exit codes, real streams, a real server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration

  browser:
    # Drives the board in a real Chromium against the real binary: drag and
    # drop, <dialog>, focus and blur and the poll, none of which a simulated DOM
    # gets right. playwright-core ships no browser, so this job installs one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The build a given playwright-core wants is pinned in the lockfile,
          # so the lockfile is what invalidates the cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # A no-op download on a cache hit; the system libraries are still checked.
      - run: bunx playwright-core install --with-deps chromium
      - run: make test-browser

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-go

  frontend:
    # The built frontend is committed so releases need no Bun; this job fails if
    # it is stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Vue and the SFC loader are build-time dependencies now, so the build
      # needs them installed before it can produce anything.
      - run: bun install --frozen-lockfile
      # Bun's bundler strips types without checking them, so nothing else in
      # this job would notice a type error (TQ-0024).
      - run: make typecheck
      - run: make test-frontend
      - run: make frontend
      - name: The built frontend must match the committed output
        # Not `git diff`: that only sees tracked files, so a newly generated
        # asset nobody committed would pass unnoticed (TQ-0026).
        run: |
          if [ -n "$(git status --porcelain -- internal/web/public)" ]; then
            echo "internal/web/public is stale. Run 'make frontend' and commit it:" >&2
            git status --porcelain -- internal/web/public >&2
            exit 1
          fi
