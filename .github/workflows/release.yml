name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can point at a commit CI never saw, and CI does not run on tags, so
  # the checks run here too. Publishing binaries that fail their own tests, or
  # that embed a stale frontend, is worse than a slow release (TQ-0025).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: make ci-lint
      - run: make test
      - run: make typecheck
      - run: make test-frontend
      - run: make frontend
      - name: The built frontend must match the committed output
        run: |
          if [ -n "$(git status --porcelain -- internal/web/public)" ]; then
            echo "internal/web/public is stale. Run 'make frontend' and commit it:" >&2
            git status --porcelain -- internal/web/public >&2
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Creating a release needs write; the default token is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
