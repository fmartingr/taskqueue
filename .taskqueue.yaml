version: 1
path: .tasks

# The project's label vocabulary. Labels stay freeform — any label can be put on
# a task — and this set is what gives them a colour, a display name and the
# grouping the board shows. A "/" groups labels for display only; the label is
# stored and matched as the whole string. Hex colours must be quoted, or YAML
# reads them as a comment.
labels:
  bug:
    color: "#d73a4a"
    display_name: Bug
  feature:
    color: "#0e8a16"
    display_name: Feature
  chore:
    color: "#8b949e"
    display_name: Chore
  docs:
    color: "#0075ca"
    display_name: Docs
  refactor:
    color: "#6f42c1"
    display_name: Refactor
  security:
    color: "#b60205"
    display_name: Security
  performance:
    color: "#fbca04"
    display_name: Performance
  tests:
    color: "#5319e7"
    display_name: Tests
  component/backend:
    color: "#1d76db"
    display_name: Backend
  component/frontend:
    color: "#c5def5"
    display_name: Frontend
  component/cli:
    color: "#0052cc"
    display_name: CLI
  component/api:
    color: "#006b75"
    display_name: API
  component/store:
    color: "#5319e7"
    display_name: Store
  component/ci:
    color: "#bfd4f2"
    display_name: CI
  component/build:
    color: "#d4c5f9"
    display_name: Build
  component/config:
    color: "#c2e0c6"
    display_name: Config
