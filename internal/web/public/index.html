<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tq — task queue</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">tq</h1>

      <div class="filters">
        <label>
          Status
          <select id="filter-status">
            <option value="">any</option>
            <option value="backlog">backlog</option>
            <option value="todo">todo</option>
            <option value="in-progress">in-progress</option>
            <option value="done">done</option>
          </select>
        </label>
        <label>
          Priority
          <!-- Filled from the project's vocabulary in GET /api/config. -->
          <select id="filter-priority">
            <option value="">any</option>
          </select>
        </label>
        <label>
          Assignee
          <input id="filter-assignee" type="search" placeholder="anyone" autocomplete="off" />
        </label>
        <label>
          Label
          <!-- Filled from the project's vocabulary, grouped by prefix. -->
          <select id="filter-label">
            <option value="">any</option>
          </select>
        </label>
        <label class="checkbox">
          <input id="filter-ready" type="checkbox" />
          Ready only
        </label>
        <button id="filter-reset" type="button" class="ghost">Reset</button>
      </div>

      <button id="new-task" type="button" class="primary">New task</button>
    </header>

    <main id="board" class="board"></main>

    <footer class="statusbar">
      <span id="status-line">Loading…</span>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <dialog id="task-dialog" class="dialog">
      <form method="dialog" id="task-form">
        <header class="dialog-header">
          <span class="task-id" id="task-dialog-id"></span>
          <button type="button" class="ghost close" data-close="task-dialog" aria-label="Close">✕</button>
        </header>

        <label>
          Title
          <input id="task-title" name="title" type="text" required />
        </label>

        <div class="grid">
          <label>
            Status
            <select id="task-status" name="status">
              <option value="backlog">backlog</option>
              <option value="todo">todo</option>
              <option value="in-progress">in-progress</option>
              <option value="done">done</option>
            </select>
          </label>
          <label>
            Priority
            <select id="task-priority" name="priority"></select>
          </label>
          <label>
            Assignee
            <input id="task-assignee" name="assignee" type="text" autocomplete="off" />
          </label>
          <label>
            Labels
            <input id="task-labels" name="labels" type="text" placeholder="backend, auth" autocomplete="off" />
          </label>
          <label>
            Depends on
            <input id="task-depends-on" name="depends_on" type="text" placeholder="TQ-0002, TQ-0003" autocomplete="off" />
          </label>
        </div>

        <p id="task-blocked" class="blocked-note" hidden></p>

        <label>
          Body (Markdown)
          <textarea id="task-body" name="body" rows="10" spellcheck="false"></textarea>
        </label>

        <section class="notes-section">
          <h3 class="notes-title">Notes</h3>
          <ul id="task-notes" class="notes"></ul>
          <div class="note-row">
            <input id="task-note" type="text" placeholder="Append a timestamped note…" autocomplete="off" />
            <button type="button" id="task-note-add" class="ghost">Add note</button>
          </div>
        </section>

        <footer class="dialog-footer">
          <span class="timestamps" id="task-timestamps"></span>
          <span class="spacer"></span>
          <button type="button" class="ghost" data-close="task-dialog">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </footer>
      </form>
    </dialog>

    <dialog id="create-dialog" class="dialog">
      <form method="dialog" id="create-form">
        <header class="dialog-header">
          <span class="task-id">New task</span>
          <button type="button" class="ghost close" data-close="create-dialog" aria-label="Close">✕</button>
        </header>

        <label>
          Title
          <input id="create-title" name="title" type="text" required />
        </label>

        <div class="grid">
          <label>
            Status
            <select id="create-status" name="status">
              <option value="backlog">backlog</option>
              <option value="todo" selected>todo</option>
              <option value="in-progress">in-progress</option>
              <option value="done">done</option>
            </select>
          </label>
          <label>
            Priority
            <select id="create-priority" name="priority"></select>
          </label>
          <label>
            Assignee
            <input id="create-assignee" name="assignee" type="text" autocomplete="off" />
          </label>
          <label>
            Labels
            <input id="create-labels" name="labels" type="text" placeholder="backend, auth" autocomplete="off" />
          </label>
          <label>
            Depends on
            <input id="create-depends-on" name="depends_on" type="text" placeholder="TQ-0002" autocomplete="off" />
          </label>
        </div>

        <label>
          Body (Markdown)
          <textarea id="create-body" name="body" rows="8" spellcheck="false"></textarea>
        </label>

        <footer class="dialog-footer">
          <span class="spacer"></span>
          <button type="button" class="ghost" data-close="create-dialog">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
